[platformio]
default_envs = wearable_c3, gateway_s3
src_dir = .

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++17
  -I firmware/shared/include

[env:wearable_c3]
board = esp32-c3-devkitm-1
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
  ${common.build_flags}
  -I firmware/wearable_c3/src
build_src_filter =
  +<firmware/shared/src/*>
  +<firmware/wearable_c3/src/*>
lib_deps =
  bblanchon/ArduinoJson@^7.1.0
  mikalhart/TinyGPSPlus@^1.1.0
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  adafruit/Adafruit GFX Library@^1.11.10
  adafruit/Adafruit SSD1306@^2.5.11
  adafruit/Adafruit MPU6050@^2.2.6

[env:gateway_s3]
board = esp32-s3-devkitc-1
platform = ${common.platform}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags =
  ${common.build_flags}
  -I firmware/gateway_s3/src
build_src_filter =
  +<firmware/shared/src/*>
  +<firmware/gateway_s3/src/*>
lib_deps =
  bblanchon/ArduinoJson@^7.1.0
  knolleary/PubSubClient@^2.8
  https://github.com/adafruit/Adafruit_SHT31.git
  claws/BH1750@^1.3.0
